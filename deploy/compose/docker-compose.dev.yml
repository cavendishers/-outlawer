services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: outlawer
      POSTGRES_USER: outlawer
      POSTGRES_PASSWORD: outlawer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outlawer -d outlawer"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
      args:
        INSTALL_DEV: "true"
    working_dir: /app
    env_file:
      - ../../.env
    command: >
      sh -c "python scripts/wait_for_db.py &&
             alembic upgrade head &&
             python scripts/create_admin.py"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://outlawer:outlawer@postgres:5432/outlawer
      REDIS_URL: redis://redis:6379/0
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: outlawer-assets

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
      args:
        INSTALL_DEV: "true"
    working_dir: /app
    env_file:
      - ../../.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://outlawer:outlawer@postgres:5432/outlawer
      REDIS_URL: redis://redis:6379/0
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: outlawer-assets
      SECRET_KEY: dev-secret-key
    volumes:
      - ../../server:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
      args:
        INSTALL_DEV: "true"
    working_dir: /app
    env_file:
      - ../../.env
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://outlawer:outlawer@postgres:5432/outlawer
      REDIS_URL: redis://redis:6379/0
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: outlawer-assets
      SECRET_KEY: dev-secret-key
    volumes:
      - ../../server:/app

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_PROXY_TARGET: http://api:8000
      NEXT_DIST_DIR: .next-dev
    volumes:
      - ../../web:/app
      - /app/node_modules
      - /app/.next-dev
    command: sh -c "mkdir -p .next-dev && find .next-dev -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true; npm install && npm run dev"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ../docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
