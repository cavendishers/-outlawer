[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outlawer-server"
version = "0.1.0"
description = "Backend for the Outlawer online knowledge base"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "celery[rabbitmq]==5.5.3",
  "fastapi==0.116.1",
  "greenlet==3.2.4",
  "httpx==0.28.1",
  "minio==7.2.18",
  "openai==1.93.1",
  "pgvector==0.4.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "pwdlib[argon2]==0.2.1",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
  "vosk==0.3.45",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
